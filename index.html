<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>وحید طاهری | طراح سایت</title>
  <!-- Font Awesome (برای آیکون‌ها) -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
  <body>
  </body>
<script>
  async function fetchAndDisplayJSON(url) {
    try {
        // دریافت داده از URL
        const response = await fetch(url);
        
        // بررسی موفقیت آمیز بودن درخواست
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        // تبدیل به JSON
        const data = await response.json();
        
        // نمایش به صورت فرمت شده
        console.log('داده‌های JSON:', data);
        
        // نمایش به صورت رشته JSON با فرمت زیبا
        const jsonString = JSON.stringify(data, null, 2);
        console.log('JSON فرمت شده:');
        console.log(jsonString);
        
        // اگر در مرورگر هستی، می‌تونی در صفحه نمایش بدی
        displayInPage(jsonString);
        
        return data;
        
    } catch (error) {
        console.error('خطا در دریافت JSON:', error);
        document.getElementById('output').innerHTML = 
            `<div style="color: red;">خطا: ${error.message}</div>`;
    }
}

// تابع برای نمایش در صفحه
function displayInPage(jsonString) {
    const outputDiv = document.getElementById('output');
    if (outputDiv) {
        outputDiv.innerHTML = `
            <pre style="background: #f4f4f4; padding: 15px; border-radius: 5px; 
                         overflow: auto; max-height: 500px;">
                ${jsonString}
            </pre>
        `;
    }
}

// استفاده از تابع
const jsonUrl = 'https://raw.githubusercontent.com/seyedvahidtaheri/vahidtaheri.github.io/refs/heads/main/classes.json';
fetchAndDisplayJSON(jsonUrl);
</script>
</html>
